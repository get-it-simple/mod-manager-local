name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "!tests/**"
      - "!tools/**"
      - "tools/prepare_build.py"
      - "tools/release.py"
      - "tools/publish_release.py"
      - "tools/*.ps1"
      - "installer/**"
      - "requirements.txt"
      - "pytest.ini"
      - "assets/**"
      - ".github/workflows/build.yml"
      - ".github/actions/prepare-build/**"

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  tests:
    name: Python pytest
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip

      - name: Prepare build dependencies
        uses: ./.github/actions/prepare-build

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build:
    name: Build and test installers
    needs: tests
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: x64
          check-latest: true
          cache: pip

      - name: Prepare build dependencies
        uses: ./.github/actions/prepare-build

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up WiX
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install pinned WiX
        run: dotnet tool install wix --tool-path build/tools --version 6.0.2

      - name: Build executable formats
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python build-gui-exe.py --exe --onedir
          python build-gui-exe.py --exe --onefile --no-clean-before

      - name: Build and smoke-test release assets
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c 'from app_paths import APP_VERSION; print(APP_VERSION)'
          ./tools/smoke_release.ps1 -Version $version
          $wix = (Resolve-Path build/tools/wix.exe).Path
          $installer = python -m tools.release build-msi --wix $wix | Select-Object -Last 1
          $olderInstaller = python -m tools.release build-msi --wix $wix --upgrade-fixture --output build/upgrade-fixture | Select-Object -Last 1
          ./tools/smoke_release.ps1 -Version $version -Installer $installer -OlderInstaller $olderInstaller
          Copy-Item -LiteralPath dist/mod-manager-gui.exe -Destination "dist/release/mod-manager-gui-v$version.exe"

      - name: Store verified binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-binaries
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Store MSI smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-smoke-logs
          path: build/smoke-*/msi-*.log
          if-no-files-found: ignore
          overwrite: true

  publish:
    name: Validate WinGet and publish release
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Download verified binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-release-binaries
          path: dist/release

      - name: Ensure WinGet supports schema 1.28.0
        shell: pwsh
        run: |
          function Get-WinGetClientVersion {
            if (Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue) {
              [string]$output = winget.exe --version
              if ($LASTEXITCODE -eq 0 -and $output -match '^v?(\d+\.\d+\.\d+)$') {
                return [version]$Matches[1]
              }
            }
          }

          $minimumVersion = [version]'1.29.380'
          $clientVersion = Get-WinGetClientVersion
          if ($clientVersion -lt $minimumVersion) {
            $releaseUrl = "https://github.com/microsoft/winget-cli/releases/download/v$minimumVersion"
            $downloadDir = Join-Path $env:RUNNER_TEMP "winget-$minimumVersion"
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
            $bundleName = 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
            $dependencyName = 'DesktopAppInstaller_Dependencies.zip'
            $bundle = Join-Path $downloadDir $bundleName
            $dependencyZip = Join-Path $downloadDir $dependencyName
            Invoke-WebRequest -Uri "$releaseUrl/$bundleName" -OutFile $bundle
            Invoke-WebRequest -Uri "$releaseUrl/$dependencyName" -OutFile $dependencyZip
            Expand-Archive -LiteralPath $dependencyZip -DestinationPath $downloadDir -Force
            $dependencies = (Get-ChildItem -LiteralPath (Join-Path $downloadDir 'x64') -File).FullName
            Import-Module Appx -UseWindowsPowerShell
            Add-AppxPackage -Path $bundle -DependencyPath $dependencies
            $clientVersion = Get-WinGetClientVersion
          }

          if ($clientVersion -lt $minimumVersion) {
            throw "WinGet $minimumVersion or later is required. Detected version: $clientVersion"
          }
          Write-Host "WinGet $clientVersion"

      - name: Validate and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.publish_release

      - name: Store WinGet submission files
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: dist/winget/*.zip
          if-no-files-found: error
          overwrite: true
