name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "!tests/**"
      - "!tools/**"
      - "tools/prepare_build.py"
      - "requirements.txt"
      - "pytest.ini"
      - "assets/**"
      - ".github/workflows/build.yml"
      - ".github/actions/prepare-build/**"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  tests:
    name: Python pytest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip

      - name: Prepare build dependencies
        uses: ./.github/actions/prepare-build

      - name: Audit dependencies
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $before = $env:PUSH_BEFORE
          $hasPushBase = $false
          if ($before -and $before -notmatch '^0+$') {
            git cat-file -e "$before^{commit}" 2>$null
            $hasPushBase = $LASTEXITCODE -eq 0
          }
          $changed = if ($hasPushBase) {
            git diff --name-only $before HEAD
          } else {
            git diff-tree --root --diff-merges=first-parent --no-commit-id --name-only -r HEAD
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not determine changed files." }
          if ($changed -notcontains "requirements.txt") {
            Write-Host "requirements.txt not modified, skipping audit."
            return
          }
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build:
    name: Build and release
    needs: tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip

      - name: Prepare build dependencies
        uses: ./.github/actions/prepare-build

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python build-gui-exe.py --exe --onefile

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $match = Select-String -Path app_paths.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          $versionTag = "v$version"
          $title = "Mod Manager $versionTag"
          $releasePages = gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' |
            ConvertFrom-Json -NoEnumerate
          $matchingReleases = @(
            foreach ($page in $releasePages) {
              $page | Where-Object { $_.name -ceq $title -or $_.tag_name -ceq $versionTag }
            }
          )
          if ($matchingReleases.Count -gt 1) { throw "More than one release matches $title." }
          $release = $matchingReleases | Select-Object -First 1

          $tag = $versionTag
          if ($release) {
            $tag = $release.tag_name
          } elseif ((git tag --list $tag) -and -not (git tag --points-at HEAD --list $tag)) {
            $tag = "$versionTag-$(git rev-parse --short HEAD)"
          }
          $prev = git tag --list 'v*' --merged HEAD --sort=-creatordate |
            Where-Object { $_ -ne $tag -and $_ -ne $versionTag -and $_ -notlike "$versionTag-*" } |
            Select-Object -First 1
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $repoUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $commit = $env:GITHUB_SHA
          $lines = @("Built from [``$commit``]($repoUrl/commit/$commit).", "", "## Commits", "")
          git log $range --no-merges --format="%H%x09%h%x09%s" | ForEach-Object {
            $sha, $short, $subject = $_ -split "`t", 3
            $lines += "- [``$short``]($repoUrl/commit/$sha) $subject"
          }
          if ($prev) {
            $lines += ""
            $lines += "Previous release: [$prev]($repoUrl/releases/tag/$prev)"
          }
          $lines | Set-Content notes.md -Encoding utf8
          $assetPrefix = "mod-manager-gui-$versionTag"
          $asset = "$assetPrefix-run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.exe"
          Move-Item dist/mod-manager-gui.exe "dist/$asset"

          if (-not $release) {
            gh release create $tag "dist/$asset" --target $commit --title $title --notes-file notes.md
            return
          }

          gh release upload $tag "dist/$asset"
          gh release edit $tag --notes-file notes.md
          $managedAssetPattern = "^$([regex]::Escape($assetPrefix))(-[0-9a-f]{7,40}|-run-\d+-\d+)?\.exe$"
          foreach ($oldAsset in $release.assets | Where-Object { $_.name -cmatch $managedAssetPattern }) {
            gh release delete-asset $tag $oldAsset.name --yes
          }
